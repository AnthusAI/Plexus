[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "plexus"
version = "1.63.0"
description = "A Python module for configuring and managing data scoring"
readme = "README.md"
license = "MIT"
authors = ["Anthus AI Solutions"]
packages = [{ include = "plexus" }]
include = [
    "plexus/templates/*",
    "plexus/__main__.py",
    "plexus/py.typed",
    "plexus/scores/*.py",
    "plexus/optimization/semantic_pricing/*.json",
    "plexus/rubric_memory/procedures/*.tac",
    "plexus/runtime/async_score_processor/Dockerfile",
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
# --- Core (always installed) ---
click = ">=8.1.7,<9.0.0"
dateparser = ">=1.1.0"
python-dotenv = ">=1.1.0"
nest_asyncio = "*"
python-statemachine = ">=2.5.0"
openai = ">=1.35.10"
tenacity = "8.2.3"
pybind11 = "*"
tiktoken = "0.12.0"
boto3 = { version = "*", optional = true }
"ruamel.yaml" = ">=0.18.10"
mistune = "3.0.2"
pyyaml = "*"
langchain = { version = "0.3.27", optional = true }
"langchain-core" = { version = "0.3.81", optional = true }
"langchain-community" = { version = "0.3.31", optional = true }
langgraph = { version = "0.6.7", optional = true }
"langchain-aws" = { version = "0.2.35", optional = true }
"langchain-openai" = { version = "0.3.35", optional = true }
"langchain-ollama" = { version = "0.3.10", optional = true }
"langchain-google-vertexai" = { version = "2.1.2", optional = true }
"langchain-anthropic" = { version = "0.3.22", optional = true }
"langgraph-checkpoint-postgres" = { version = "2.0.9", optional = true }
psycopg = { version = ">=3.2.0,<4.0.0", extras = ["binary"], optional = true }
tactus = { version = "0.52.0", optional = true }
behave = { version = ">=1.2.6", optional = true }
gherkin-official = { version = ">=28.0.0", optional = true }
rapidfuzz = "3.9.4"
azure-identity = { version = ">=1.15.0", optional = true }
rich = ">=13.9.4"
gql = { version = ">=3.0.0,<4.0.0", extras = ["requests"] }
openai-cost-calculator = { git = "https://github.com/AnthusAI/openai_cost_calculator.git", branch = "main", optional = true }
fastmcp = { version = ">=2.14.0,<3.0.0", optional = true }
ollama = { version = ">=0.1.6", optional = true }
requests = ">=2.31.0"
keyring = ">=25.7.0"
requests-aws4auth = { version = "*", optional = true }
qdrant-client = { version = ">=1.10.0", optional = true }
# --- Optional: ML/scoring/visualization ---
pandas = { version = "2.1.4", optional = true }
pyarrow = { version = "21.0.0", optional = true }
nltk = { version = "3.9.4", optional = true }
transformers = { version = "*", optional = true }
seaborn = { version = "*", optional = true }
pydot = { version = "2.0.0", optional = true }
pydotplus = { version = "2.0.2", optional = true }
graphviz = { version = "0.20.3", optional = true }
scikit-learn = { version = "1.5.1", optional = true }
tables = { version = "*", optional = true }
xgboost = { version = "2.0.3", optional = true }
imbalanced-learn = { version = "0.12.3", optional = true }
imblearn = { version = "0.0", optional = true }
shap = { version = "0.45.1", optional = true }
numba = { version = "0.59.1", optional = true }
contractions = { version = "0.1.73", optional = true }
openpyxl = { version = "3.1.5", optional = true }
datasets = { version = "*", optional = true }
gensim = { version = "*", optional = true }
bertopic = { version = ">=0.16.2", optional = true }
umap-learn = { version = "0.5.7", optional = true }
hdbscan = { version = "0.8.40", optional = true }
sentence-transformers = { version = ">=5.0.0", optional = true }
biblicus = { version = ">=1.11.3,<2.0.0", extras = ["reinforcement-memory"], optional = true }
kaleido = { version = ">=0.2.1", optional = true }
# --- Optional: Infrastructure ---
celery = { version = ">=5.4.0", optional = true }
fastapi = { version = ">=0.124.4", optional = true }
uvicorn = { version = ">=0.42.0", extras = ["standard"], optional = true }
pycurl = { version = ">=7.45.4", optional = true }
sqlalchemy = { version = "1.4.15", extras = ["asyncio"], optional = true }
pyairtable = { version = "*", optional = true }

[tool.poetry.extras]
ml = [
    "pandas", "nltk", "transformers", "seaborn",
    "pydot", "pydotplus", "graphviz",
    "scikit-learn", "tables", "xgboost",
    "imbalanced-learn", "imblearn", "shap", "numba",
    "contractions", "openpyxl", "datasets", "gensim",
    "bertopic", "umap-learn", "hdbscan",
    "sentence-transformers", "kaleido",
]
# Runtime set for LangGraphScore and TactusScore prediction workers.
# Training, evaluation reporting, and broad data tooling stay out of this extra.
scoring = [
    "boto3",
    "langchain", "langchain-core", "langchain-community",
    "langgraph", "langchain-aws", "langchain-openai",
    "langchain-ollama", "langchain-anthropic", "langgraph-checkpoint-postgres",
    "psycopg", "tactus", "nltk",
]
# The general Kubernetes worker also hosts legacy CLI workflows used by the
# local demo. Keep their data and rendering dependencies out of the production
# scoring Lambda while declaring them explicitly for that worker image.
worker = ["graphviz", "pandas", "pyarrow", "contractions", "seaborn", "openpyxl"]
# Direct dependencies used by the interactive Console worker in addition to
# the scoring runtime. Keep broad service infrastructure out of this image.
console = ["celery", "fastmcp", "requests-aws4auth"]
google-vertexai = [
    "langchain-google-vertexai",
]
# Tactus procedure specification testing is an authoring capability, not a
# scoring-worker runtime dependency.
procedures = ["tactus", "behave", "gherkin-official"]
# Evaluation and optimization workers need the full reinforcement-memory stack
# (embeddings, clustering, and its Virtuus state engine) for feedback RCA.
evaluation = ["sentence-transformers", "biblicus"]
infra = [
    "celery", "fastapi", "uvicorn", "pycurl", "sqlalchemy", "pyairtable",
    "azure-identity", "fastmcp", "requests-aws4auth",
    "qdrant-client", "ollama",
]
all = [
    "openai-cost-calculator",
    "pandas", "pyarrow", "nltk", "transformers", "seaborn",
    "pydot", "pydotplus", "graphviz",
    "scikit-learn", "tables", "xgboost",
    "imbalanced-learn", "imblearn", "shap", "numba",
    "contractions", "openpyxl", "datasets", "gensim",
    "bertopic", "umap-learn", "hdbscan",
    "sentence-transformers", "kaleido",
    "celery", "fastapi", "uvicorn", "pycurl", "sqlalchemy", "pyairtable",
    "boto3",
    "langchain", "langchain-core", "langchain-community",
    "langgraph", "langchain-aws", "langchain-openai",
    "langchain-ollama", "langchain-google-vertexai",
    "langchain-anthropic", "langgraph-checkpoint-postgres",
    "psycopg", "tactus", "behave", "gherkin-official",
    "azure-identity", "fastmcp", "requests-aws4auth",
    "qdrant-client", "ollama",
]

[tool.poetry.group.dev.dependencies]
invoke = ">=2.2.0"
pytest = "8.2.2"
flake8 = "7.1.1"
pytest-cov = "5.0.0"
pyfakefs = ">=5.0.0"
pytest-watch = "4.2.0"
pytest-asyncio = "0.23.5"
behave = ">=1.2.6"
gherkin-official = ">=28.0.0"
sphinx = "*"
sphinx-rtd-theme = "*"
aws-cdk-lib = ">=2.100.0"
constructs = ">=10.0.0"

[tool.poetry.scripts]
plexus = "plexus.cli.entrypoint:main"
plexus-dashboard = "plexus.dashboard.cli:cli"
plexus-command-worker = "plexus.command_worker.runtime:main"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
    "ignore:Deprecated call to `pkg_resources.declare_namespace:DeprecationWarning"
]
markers = [
    "integration: marks tests that make actual external LLM API calls"
]
addopts = "-m 'not integration'"

[tool.coverage.run]
omit = ["*_test.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
    "except ImportError:",
    "def main"
]

[tool.semantic_release]
version_source = "tag"
version_toml = ["pyproject.toml:tool.poetry.version"]
version_variables = ["plexus/_version.py:__version__"]
commit_message = "chore: release {version}"
major_on_zero = false
tag_format = "v{version}"
changelog_file = "CHANGELOG.md"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.staging]
match = "staging"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.branches.dev]
match = "dev"
prerelease = true
prerelease_token = "alpha"

[tool.pydantic-settings]
protected_namespaces = []
