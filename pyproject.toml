[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "plexus"
version = "1.58.1"
description = "A Python module for configuring and managing data scoring"
readme = "README.md"
license = "MIT"
authors = ["Anthus AI Solutions"]
packages = [{ include = "plexus" }]
include = [
    "plexus/templates/*",
    "plexus/__main__.py",
    "plexus/py.typed",
    "plexus/scores/*.py",
    "plexus/rubric_memory/procedures/*.tac",
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
# --- Core (always installed) ---
dateparser = ">=1.1.0"
python-dotenv = ">=1.1.0"
nest_asyncio = "*"
python-statemachine = ">=2.5.0"
openai = ">=1.35.10"
tenacity = "8.2.3"
pybind11 = "*"
tiktoken = "0.12.0"
boto3 = "*"
"ruamel.yaml" = ">=0.18.10"
mistune = "3.0.2"
pyyaml = "*"
langchain = "0.3.27"
"langchain-core" = "0.3.81"
"langchain-community" = "0.3.31"
langgraph = "0.6.7"
"langchain-aws" = "0.2.35"
"langchain-openai" = "0.3.35"
"langchain-ollama" = "0.3.10"
"langchain-google-vertexai" = "2.1.2"
"langchain-anthropic" = "0.3.22"
"langgraph-checkpoint-postgres" = "2.0.9"
psycopg = { version = ">=3.2.0,<4.0.0", extras = ["binary"] }
lupa = "2.7"
tactus = [
    { version = "^0.51.3" },
    { version = "^0.51.3", extras = ["rca"], markers = "extra == 'ml' or extra == 'all'" },
]
rapidfuzz = "3.9.4"
watchtower = "*"
azure-identity = ">=1.15.0"
rich = ">=13.9.4"
gql = { version = ">=3.0.0,<4.0.0", extras = ["requests"] }
openai-cost-calculator = { git = "https://github.com/AnthusAI/openai_cost_calculator.git", branch = "main" }
fastmcp = ">=2.3.5"
ollama = ">=0.1.6"
requests = ">=2.31.0"
requests-aws4auth = "*"
# --- Optional: ML/scoring/visualization ---
pandas = { version = "2.1.4", optional = true }
nltk = { version = "3.9.4", optional = true }
transformers = { version = "*", optional = true }
seaborn = { version = "*", optional = true }
pydot = { version = "2.0.0", optional = true }
pydotplus = { version = "2.0.2", optional = true }
graphviz = { version = "0.20.3", optional = true }
scikit-learn = { version = "1.5.1", optional = true }
tables = { version = "*", optional = true }
xgboost = { version = "2.0.3", optional = true }
imbalanced-learn = { version = "0.12.3", optional = true }
imblearn = { version = "0.0", optional = true }
shap = { version = "0.45.1", optional = true }
numba = { version = "0.59.1", optional = true }
contractions = { version = "0.1.73", optional = true }
openpyxl = { version = "3.1.5", optional = true }
datasets = { version = "*", optional = true }
gensim = { version = "*", optional = true }
bertopic = { version = ">=0.16.2", optional = true }
umap-learn = { version = "0.5.7", optional = true }
hdbscan = { version = "0.8.40", optional = true }
sentence-transformers = { version = ">=5.0.0", optional = true }
kaleido = { version = ">=0.2.1", optional = true }
# --- Optional: Infrastructure ---
celery = { version = ">=5.4.0", optional = true }
fastapi = { version = ">=0.124.4", optional = true }
uvicorn = { version = ">=0.42.0", extras = ["standard"], optional = true }
pycurl = { version = ">=7.45.4", optional = true }
sqlalchemy = { version = "1.4.15", extras = ["asyncio"], optional = true }
pyairtable = { version = "*", optional = true }

[tool.poetry.extras]
ml = [
    "pandas", "nltk", "transformers", "seaborn",
    "pydot", "pydotplus", "graphviz",
    "scikit-learn", "tables", "xgboost",
    "imbalanced-learn", "imblearn", "shap", "numba",
    "contractions", "openpyxl", "datasets", "gensim",
    "bertopic", "umap-learn", "hdbscan",
    "sentence-transformers", "kaleido",
]
infra = [
    "celery", "fastapi", "uvicorn", "pycurl", "sqlalchemy", "pyairtable",
]
all = [
    "pandas", "nltk", "transformers", "seaborn",
    "pydot", "pydotplus", "graphviz",
    "scikit-learn", "tables", "xgboost",
    "imbalanced-learn", "imblearn", "shap", "numba",
    "contractions", "openpyxl", "datasets", "gensim",
    "bertopic", "umap-learn", "hdbscan",
    "sentence-transformers", "kaleido",
    "celery", "fastapi", "uvicorn", "pycurl", "sqlalchemy", "pyairtable",
]

[tool.poetry.group.dev.dependencies]
invoke = ">=2.2.0"
pytest = "8.2.2"
flake8 = "7.1.1"
pytest-cov = "5.0.0"
pyfakefs = ">=5.0.0"
pytest-watch = "4.2.0"
pytest-asyncio = "0.23.5"
sphinx = "*"
sphinx-rtd-theme = "*"

[tool.poetry.scripts]
plexus = "plexus.cli.shared.CommandLineInterface:main"
plexus-dashboard = "plexus.dashboard.cli:cli"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
    "ignore:Deprecated call to `pkg_resources.declare_namespace:DeprecationWarning"
]
markers = [
    "integration: marks tests that make actual external LLM API calls"
]
addopts = "-m 'not integration'"

[tool.coverage.run]
omit = ["*_test.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
    "except ImportError:",
    "def main"
]

[tool.semantic_release]
version_source = "tag"
version_toml = ["pyproject.toml:tool.poetry.version"]
version_variables = ["plexus/_version.py:__version__"]
commit_message = "chore: release {version}"
major_on_zero = false
tag_format = "v{version}"
changelog_file = "CHANGELOG.md"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.staging]
match = "staging"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.branches.dev]
match = "dev"
prerelease = true
prerelease_token = "alpha"

[tool.pydantic-settings]
protected_namespaces = []
