version: '3.8'

# Full local stack simulating production Kubernetes deployment
# This includes: RabbitMQ, PostgreSQL, GraphQL Proxy, and Plexus Workers

services:
  # Message Queue - replaces AWS SQS
  rabbitmq:
    image: rabbitmq:3.12-management
    hostname: rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: plexus
      RABBITMQ_DEFAULT_PASS: plexus
      RABBITMQ_DEFAULT_VHOST: /
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  # Private Data Store - replaces AWS DynamoDB/S3 for private data
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: plexus
      POSTGRES_PASSWORD: plexus
      POSTGRES_DB: plexus_proxy
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plexus -d plexus_proxy"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # The Adapter - GraphQL proxy for private data
  graphql-proxy:
    build:
      context: ../
      dockerfile: services/private-graphql-proxy/Dockerfile
    environment:
      # Proxy configuration
      PLEXUS_PROXY_DATABASE_URL: postgresql://plexus:plexus@postgres:5432/plexus_proxy
      PLEXUS_PROXY_API_KEY: ${PLEXUS_PROXY_API_KEY:-local-dev-key}

      # Upstream AWS AppSync (for control-plane data)
      PLEXUS_PROXY_UPSTREAM_API_URL: ${PLEXUS_API_URL}
      PLEXUS_PROXY_UPSTREAM_API_KEY: ${PLEXUS_API_KEY}

      # Cache settings
      PLEXUS_PROXY_CACHE_TTL_SECONDS: 900
      PLEXUS_PROXY_CACHE_STALE_SECONDS: 86400
      PLEXUS_PROXY_ENABLE_DEBUG: "true"
    ports:
      - "18080:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Plexus Worker - Celery mode consuming from RabbitMQ
  plexus-worker-celery:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    environment:
      # Worker configuration
      WORKER_TYPE: celery
      LOG_LEVEL: DEBUG
      MAX_JOBS_PER_WORKER: "10"

      # Point to local GraphQL proxy instead of AWS
      PLEXUS_API_URL: http://graphql-proxy:8000/graphql
      PLEXUS_API_KEY: ${PLEXUS_PROXY_API_KEY:-local-dev-key}
      PLEXUS_ACCOUNT_KEY: ${PLEXUS_ACCOUNT_KEY}

      # Scorecard cache directory
      SCORECARD_CACHE_DIR: /tmp/plexus-scorecards

      # Celery + RabbitMQ configuration
      CELERY_BROKER_URL: amqp://plexus:plexus@rabbitmq:5672/
      CELERY_RESULT_BACKEND: rpc://plexus:plexus@rabbitmq:5672/
      CELERY_APP: plexus.workers.celery_app:app
      CELERY_QUEUE: scoring-requests
      CELERY_CONCURRENCY: "4"

      # LLM API keys (if needed for scoring)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # AWS credentials (for S3 attachments, etc - optional)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-west-2}
    depends_on:
      rabbitmq:
        condition: service_healthy
      graphql-proxy:
        condition: service_healthy
    restart: unless-stopped

  # Optional: Score Processor worker (for testing SQS compatibility)
  plexus-worker-score-processor:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    environment:
      WORKER_TYPE: score-processor
      LOG_LEVEL: DEBUG
      MAX_JOBS_PER_WORKER: "5"

      # Point to local GraphQL proxy
      PLEXUS_API_URL: http://graphql-proxy:8000/graphql
      PLEXUS_API_KEY: ${PLEXUS_PROXY_API_KEY:-local-dev-key}
      PLEXUS_ACCOUNT_KEY: ${PLEXUS_ACCOUNT_KEY}

      # SQS configuration (still using AWS SQS for now)
      PLEXUS_SCORING_WORKER_REQUEST_STANDARD_QUEUE_URL: ${PLEXUS_SCORING_WORKER_REQUEST_STANDARD_QUEUE_URL:-}
      PLEXUS_RESPONSE_WORKER_QUEUE_URL: ${PLEXUS_RESPONSE_WORKER_QUEUE_URL:-}

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-west-2}

      # LLM API keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      graphql-proxy:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - sqs-mode  # Only start if explicitly requested

volumes:
  rabbitmq-data:
  postgres-data:
