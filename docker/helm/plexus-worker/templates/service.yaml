{{- if and (eq .Values.workerType "scoring-api") .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "plexus-worker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plexus-worker.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
    protocol: TCP
  selector:
    {{- include "plexus-worker.podLabels" . | nindent 4 }}
{{- end }}
