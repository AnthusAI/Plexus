{{- if .Values.plexus.createSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plexus-worker.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plexus-worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.plexus.api.url }}
  api-url: {{ .Values.plexus.api.url | quote }}
  {{- else if .Values.global }}
  api-url: {{ include "plexus-stack.graphqlProxyUrl" . | quote }}
  {{- else }}
  api-url: ""
  {{- end }}
  api-key: {{ .Values.plexus.api.key | quote }}
  account-key: {{ .Values.plexus.account.key | quote }}
{{- end }}
---
{{- if and (eq .Values.workerType "score-processor") .Values.scoreProcessor.aws.createSecrets }}
{{- if not .Values.serviceAccount.annotations }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plexus-worker.awsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plexus-worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  aws-access-key-id: {{ .Values.scoreProcessor.aws.accessKeyId | quote }}
  aws-secret-access-key: {{ .Values.scoreProcessor.aws.secretAccessKey | quote }}
{{- end }}
{{- end }}
---
{{- if and (eq .Values.workerType "celery") .Values.celery.broker.createSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plexus-worker.celerySecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plexus-worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  broker-url: {{ .Values.celery.broker.url | quote }}
{{- end }}
---
{{- if and .Values.llm .Values.llm.createSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plexus-worker.fullname" . }}-llm-keys
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plexus-worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.llm.openai }}
  openai-api-key: {{ .Values.llm.openai.apiKey | quote }}
  {{- end }}
  {{- if .Values.llm.anthropic }}
  anthropic-api-key: {{ .Values.llm.anthropic.apiKey | quote }}
  {{- end }}
{{- end }}
