apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "graphql-proxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "graphql-proxy.labels" . | nindent 4 }}
data:
  PLEXUS_BACKEND_MODE: {{ .Values.config.backendMode | quote }}
  PLEXUS_PROXY_AUTH_MODE: {{ .Values.config.authMode | quote }}
  PLEXUS_PROXY_UPSTREAM_API_URL: {{ .Values.config.upstreamApiUrl | quote }}
  PLEXUS_PROXY_UPSTREAM_TIMEOUT_SECONDS: {{ .Values.config.upstreamTimeoutSeconds | quote }}
  PLEXUS_PROXY_UPSTREAM_DISABLED: {{ .Values.config.upstreamDisabled | quote }}
  PLEXUS_PROXY_CACHE_TTL_SECONDS: {{ .Values.config.cacheTtlSeconds | quote }}
  PLEXUS_PROXY_CACHE_STALE_SECONDS: {{ .Values.config.cacheStaleSeconds | quote }}
  PLEXUS_SCORING_JOB_CLAIM_LEASE_SECONDS: {{ .Values.config.scoringJobClaimLeaseSeconds | quote }}
  PLEXUS_PROXY_ENABLE_DEBUG: {{ .Values.config.enableDebug | quote }}
  PLEXUS_ARTIFACT_TICKETS_ENABLED: {{ .Values.artifactStore.enabled | quote }}
  PLEXUS_ARTIFACT_STORE_ENDPOINT: {{ .Values.artifactStore.endpoint | quote }}
  PLEXUS_ARTIFACT_STORE_REGION: {{ .Values.artifactStore.region | quote }}
  PLEXUS_ARTIFACT_ACCOUNT_ID: {{ .Values.artifactStore.accountId | quote }}
  PLEXUS_ARTIFACT_TICKET_TTL_SECONDS: {{ .Values.artifactStore.ticketTtlSeconds | quote }}
  PLEXUS_ARTIFACT_BUCKET_DATASETS: {{ .Values.artifactStore.buckets.datasets | quote }}
  PLEXUS_ARTIFACT_BUCKET_REPORT_BLOCK_DETAILS: {{ .Values.artifactStore.buckets.reportBlockDetails | quote }}
  PLEXUS_ARTIFACT_BUCKET_TASK_ATTACHMENTS: {{ .Values.artifactStore.buckets.taskAttachments | quote }}
  PLEXUS_ARTIFACT_BUCKET_SCORE_RESULT_ATTACHMENTS: {{ .Values.artifactStore.buckets.scoreResultAttachments | quote }}
