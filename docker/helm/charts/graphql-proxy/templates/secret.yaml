{{- if .Values.createSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "graphql-proxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "graphql-proxy.labels" . | nindent 4 }}
type: Opaque
stringData:
  proxy-api-key: {{ .Values.config.proxyApiKey | quote }}
  upstream-api-key: {{ .Values.config.upstreamApiKey | quote }}
{{- end }}
---
# Database URL secret (created by post-install job or manually)
# We'll use a Job to construct the URL with the password from PostgreSQL secret
