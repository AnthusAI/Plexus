# Default values for graphql-proxy chart

replicaCount: 2

image:
  repository: plexus-graphql-proxy
  pullPolicy: IfNotPresent
  tag: ""  # Defaults to chart appVersion if not set

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8000
  annotations: {}

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Liveness probe configuration
livenessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Readiness probe configuration
readinessProbe:
  enabled: true
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Startup probe configuration (for slow startup)
startupProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 30

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Network Policy
networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - graphql-proxy
          topologyKey: kubernetes.io/hostname

# Proxy configuration
config:
  # Proxy API key - workers use this to authenticate with the proxy
  proxyApiKey: "local-dev-key"

  # Upstream AWS AppSync configuration
  upstreamApiUrl: ""
  upstreamApiKey: ""
  upstreamTimeoutSeconds: 30
  upstreamDisabled: false

  # Cache settings
  cacheTtlSeconds: 900
  cacheStaleSeconds: 86400

  # Debug mode
  enableDebug: false

  # PostgreSQL connection
  # Constructed from global values, but can be overridden
  databaseUrl: ""  # e.g., postgresql://user:pass@host:5432/dbname

# Secret management
createSecrets: true
existingSecret: ""  # Name of existing secret to use instead

# PostgreSQL connection details (if not using databaseUrl)
postgresql:
  host: ""  # Will default to global.services.postgresql.host
  port: 5432
  database: ""  # Will default to global.services.postgresql.database
  username: ""
  password: ""
  existingSecret: ""  # Name of secret containing database credentials
  existingSecretPasswordKey: "password"  # For Bitnami PostgreSQL, use "password"
  existingSecretUsernameKey: "username"  # For Bitnami PostgreSQL in global context, the username is in auth.username
