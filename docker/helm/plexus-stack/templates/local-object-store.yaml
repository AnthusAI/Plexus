{{- if .Values.localObjectStore.enabled }}
{{- $name := printf "%s-local-object-store" .Release.Name | trunc 63 | trimSuffix "-" -}}
{{- $secretName := default $name .Values.localObjectStore.auth.existingSecret -}}
{{- if not .Values.localObjectStore.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plexus-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key-id: {{ required "localObjectStore.auth.accessKey is required" .Values.localObjectStore.auth.accessKey | quote }}
  secret-access-key: {{ required "localObjectStore.auth.secretKey is required" .Values.localObjectStore.auth.secretKey | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plexus-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: object-store
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: object-store
  ports:
    - name: api
      port: {{ .Values.localObjectStore.service.port }}
      targetPort: api
---
{{- if .Values.localObjectStore.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plexus-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: object-store
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.localObjectStore.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.localObjectStore.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plexus-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: object-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: object-store
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: object-store
    spec:
      containers:
        - name: minio
          image: "{{ .Values.localObjectStore.image.repository }}:{{ .Values.localObjectStore.image.tag }}"
          imagePullPolicy: {{ .Values.localObjectStore.image.pullPolicy }}
          args: ["server", "/data"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: access-key-id
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: secret-access-key
          ports:
            - name: api
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.localObjectStore.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.localObjectStore.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-buckets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plexus-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: object-store-init
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: object-store-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-buckets
          image: "{{ .Values.localObjectStore.clientImage.repository }}:{{ .Values.localObjectStore.clientImage.tag }}"
          imagePullPolicy: {{ .Values.localObjectStore.clientImage.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until mc alias set local http://{{ $name }}:{{ .Values.localObjectStore.service.port }} "$ACCESS_KEY" "$SECRET_KEY"; do sleep 1; done
              mc mb --ignore-existing local/{{ .Values.localObjectStore.buckets.datasets }}
              mc mb --ignore-existing local/{{ .Values.localObjectStore.buckets.reportBlockDetails }}
              mc mb --ignore-existing local/{{ .Values.localObjectStore.buckets.rubricMemory }}
              mc mb --ignore-existing local/{{ .Values.localObjectStore.buckets.taskAttachments }}
              mc mb --ignore-existing local/{{ .Values.localObjectStore.buckets.scoreResultAttachments }}
          env:
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: access-key-id
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: secret-access-key
{{- end }}
