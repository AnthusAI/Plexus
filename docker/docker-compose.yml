version: '3.8'

# Docker Compose setup for local development and testing of Plexus workers
#
# Usage:
#   docker-compose -f docker/docker-compose.yml up
#   docker-compose -f docker/docker-compose.yml up celery-worker
#   docker-compose -f docker/docker-compose.yml logs -f

services:
  # RabbitMQ for Celery broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: plexus-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: plexus
      RABBITMQ_DEFAULT_PASS: plexus
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (alternative broker for Celery)
  redis:
    image: redis:7-alpine
    container_name: plexus-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Score Processor Worker
  score-processor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: plexus-score-processor
    environment:
      WORKER_TYPE: score-processor
      LOG_LEVEL: INFO
      MAX_JOBS_PER_WORKER: "10"  # Restart after 10 jobs for testing
      ERROR_RETRY_DELAY: "5"

      # Plexus API - set these in .env file or override
      PLEXUS_API_URL: ${PLEXUS_API_URL}
      PLEXUS_API_KEY: ${PLEXUS_API_KEY}
      PLEXUS_ACCOUNT_KEY: ${PLEXUS_ACCOUNT_KEY}

      # SQS Queues
      PLEXUS_SCORING_WORKER_REQUEST_STANDARD_QUEUE_URL: ${PLEXUS_SCORING_WORKER_REQUEST_STANDARD_QUEUE_URL}
      PLEXUS_RESPONSE_WORKER_QUEUE_URL: ${PLEXUS_RESPONSE_WORKER_QUEUE_URL}

      # AWS
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}

    volumes:
      - scorecard-cache:/app/data/scorecards
      - worker-logs:/app/logs
    restart: unless-stopped
    # Uncomment to test once and exit
    # command: ["score-processor-once"]

  # Celery Worker
  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: plexus-celery-worker
    environment:
      WORKER_TYPE: celery
      LOG_LEVEL: INFO

      # Celery config
      CELERY_BROKER_URL: amqp://plexus:plexus@rabbitmq:5672//
      # Alternative: Redis broker
      # CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_APP: plexus.cli.score_chat.celery
      CELERY_QUEUE: score_chat
      CELERY_CONCURRENCY: "2"

      # Plexus API
      PLEXUS_API_URL: ${PLEXUS_API_URL}
      PLEXUS_API_KEY: ${PLEXUS_API_KEY}

    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - celery-logs:/app/logs
    restart: unless-stopped

  # Console Worker
  console-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: plexus-console-worker
    environment:
      WORKER_TYPE: console-worker
      LOG_LEVEL: INFO

      # Plexus API
      PLEXUS_API_URL: ${PLEXUS_API_URL}
      PLEXUS_API_KEY: ${PLEXUS_API_KEY}

      # Console config
      CONSOLE_RESPONSE_TARGET: ${CONSOLE_RESPONSE_TARGET:-local:developer}
      CONSOLE_LOCAL_WORKER_IDLE_POLL_SECONDS: "1.0"
      CONSOLE_LOCAL_WORKER_ERROR_BACKOFF_SECONDS: "5.0"

    volumes:
      - console-logs:/app/logs
    restart: unless-stopped

volumes:
  rabbitmq-data:
    driver: local
  redis-data:
    driver: local
  scorecard-cache:
    driver: local
  worker-logs:
    driver: local
  celery-logs:
    driver: local
  console-logs:
    driver: local
